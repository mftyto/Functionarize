<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D19"/>
      <stop offset="0.55" stop-color="#0E1729"/>
      <stop offset="1" stop-color="#17213A"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#EAF7FF"/>
      <stop offset="1" stop-color="#A9E6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DE1FF"/>
      <stop offset="0.55" stop-color="#8E6BFF"/>
      <stop offset="1" stop-color="#FF5FA2"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.42" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#4DE1FF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#4DE1FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4DE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.82" cy="0.84" r="0.58">
      <stop offset="0" stop-color="#FF5FA2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#9BC7E8" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="208"/>
    </clipPath>
  </defs>

  <!-- dark rounded tile -->
  <rect x="32" y="32" width="960" height="960" rx="208" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="960" height="960" fill="url(#grid)"/>
    <!-- graph axes -->
    <path d="M 512 72 V 952 M 72 512 H 952" stroke="#A8D6F0" stroke-opacity="0.10" stroke-width="3"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#glowCyan)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#glowPink)"/>

    <!-- faint function curve -->
    <path d="M 122 690 C 238 530 340 530 452 690 S 684 850 902 618"
          fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MDI function-variant glyph, scaled and centered -->
  <path transform="translate(176 176) scale(28)"
        d="M12.42,5.29C11.32,5.19 10.35,6 10.25,7.11L10,10H12.82V12H9.82L9.38,17.07C9.18,19.27 7.24,20.9 5.04,20.7C3.79,20.59 2.66,19.9 2,18.83L3.5,17.33C3.83,18.38 4.96,18.97 6,18.63C6.78,18.39 7.33,17.7 7.4,16.89L7.82,12H4.82V10H8L8.27,6.93C8.46,4.73 10.39,3.1 12.6,3.28C13.86,3.39 15,4.09 15.66,5.17L14.16,6.67C13.91,5.9 13.23,5.36 12.42,5.29M22,13.65L20.59,12.24L17.76,15.07L14.93,12.24L13.5,13.65L16.35,16.5L13.5,19.31L14.93,20.72L17.76,17.89L20.59,20.72L22,19.31L19.17,16.5L22,13.65Z"
        fill="url(#fg)"/>

  <!-- accent underline -->
  <rect x="312" y="812" width="400" height="24" rx="12" fill="url(#accent)" opacity="0.95"/>

  <!-- borders -->
  <rect x="32" y="32" width="960" height="960" rx="208" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="10"/>
  <rect x="24" y="24" width="976" height="976" rx="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
</svg>
